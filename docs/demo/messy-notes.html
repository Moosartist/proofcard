<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messy-notes map</title>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e3e0;--ok:#1f7a4d;--okbg:#e6f4ec;--warn:#9a6400;--warnbg:#fdf3dc;--bad:#b3261e;--badbg:#fde8e6;--plan:#5b5bd6;--planbg:#ecebfd;--unk:#6b6b70;--unkbg:#efefef;
--screen:#3b82f6;--frontend:#06b6d4;--api:#8b5cf6;--service:#f59e0b;--data:#10b981;--external:#ef4444}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#141416;--panel:#1d1d20;--ink:#ececec;--mute:#9a9aa0;--line:#2e2e33;--okbg:#153324;--warnbg:#3a2d10;--badbg:#3d1614;--planbg:#25254a;--unkbg:#2a2a2e;--ok:#5fd39a;--warn:#f3c05b;--bad:#ff8a80;--plan:#a5a5ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:20px 24px 8px}h1{margin:0 0 4px;font-size:22px}.sub{color:var(--mute)}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{padding:3px 10px;border-radius:99px;font-size:13px;background:var(--unkbg)}
.pill.error{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.ok{background:var(--okbg);color:var(--ok)}
main{display:grid;grid-template-columns:280px 1fr;gap:16px;padding:0 24px 24px}@media(max-width:800px){main{grid-template-columns:1fr;padding:0 12px 16px}header{padding:16px 12px 4px}}
nav{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;align-self:start;position:sticky;top:8px}
nav input{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:6px}
nav button span:first-child{flex:1}nav button .st{align-self:center;flex-shrink:0}nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px;border-radius:8px;cursor:pointer;font:inherit}
nav button:hover,nav button.on{background:var(--bg)}.st{font-size:11px;padding:1px 7px;border-radius:99px;white-space:nowrap}
.st.built{background:var(--okbg);color:var(--ok)}.st.building{background:var(--warnbg);color:var(--warn)}.st.planned{background:var(--planbg);color:var(--plan)}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px;overflow-x:auto}
h2{font-size:18px;margin:0 0 4px}h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:18px 0 6px}
table.grid{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}.grid th,.grid td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top;text-align:left}
.grid th{font-weight:600;color:var(--mute)}.grid td.fname{cursor:pointer;font-weight:600}.grid tr:hover td{background:var(--bg)}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:1px 7px;border-radius:6px;font:12px ui-monospace,Consolas,monospace;background:var(--unkbg);white-space:nowrap}
.chip.confirmed{background:var(--okbg);color:var(--ok)}.chip.stale,.chip.broken{background:var(--badbg);color:var(--bad)}.chip.planned{background:var(--planbg);color:var(--plan);border:1px dashed var(--plan)}.chip.unverified{background:var(--warnbg);color:var(--warn)}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}.step{position:relative;width:200px;margin:0 26px 12px 0;padding:10px;border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--bg)}
.step:not(:last-child)::after{content:'→';position:absolute;right:-21px;top:40%;color:var(--mute);font-size:18px}
.step .lay{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--c);font-weight:700}.step .does{margin:4px 0 6px}
.step.planned{border-style:dashed;opacity:.85}.step.stale,.step.broken{box-shadow:0 0 0 2px var(--bad) inset}
.src{font-size:11px;color:var(--mute)}a{color:inherit}ul{margin:4px 0;padding-left:20px}
.f{padding:6px 8px;border-radius:8px;margin:4px 0;font-size:13px}.f.error{background:var(--badbg);color:var(--bad)}.f.warn{background:var(--warnbg);color:var(--warn)}.f.info{background:var(--unkbg)}
.legend{font-size:12px;color:var(--mute)}.legend .chip{font-family:inherit}
.empty{color:var(--mute);font-style:italic}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><div class="sub" id="summary"></div>
  <div class="counts" id="counts"></div>
  <div class="legend">Links: <span class="chip confirmed">✓ found in code</span><span class="chip unverified">· file exists, link not checked</span><span class="chip planned">○ planned, not built</span><span class="chip stale">✗ stale or missing</span><span class="chip">? unknown</span></div>
</header>
<main><nav><input id="q" placeholder="Find a feature or file…" aria-label="Filter"><div id="list"></div></nav><div id="content"></div></main>
<script>
const D={"project":{"name":"messy-notes","summary":"A notes page that also stores an English translation of each note. Mapped as found; nothing has been reorganised yet."},"structure":null,"proposals":[{"change":"Move note storage (read/write notes.json) out of server.js into src/notes-store.js","why":"server.js reads and writes notes.json in two places (server.js:13, :20, :26); one store module makes the data path one place to test and fix","serves":["see-notes","add-note"],"status":"proposed"},{"change":"Move the translation call into src/translate.js with a timeout and a fallback","why":"adding a note currently fails if the translation service is slow or down (server.js:23); isolating it lets it be tested with a fake","serves":["add-note"],"status":"proposed"},{"change":"Delete old-utils.js","why":"nothing imports it (scan: orphan); its formatDate duplicates public/script.js and saveNotes writes a backup file nobody reads","serves":[],"status":"proposed"}],"generated":"2026-09-26 18:27","commit":"76b6d9f","counts":{"error":0,"warn":5,"info":10},"layers":["screen","frontend","api","service","data","external"],"features":[{"id":"see-notes","name":"See my notes","status":"built","user_action":"Opens the page and sees the list of notes with their English translation.","flow":[{"layer":"screen","does":"Notes page","file":"public/index.html","find":"id=\"notes\"","state":"confirmed","line":4,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/index.html#L4"},{"layer":"api","does":"Server sends the page and the script","file":"server.js","find":"req.url === '/script.js'","state":"confirmed","line":9,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L9"},{"layer":"frontend","does":"Loads notes and writes them into the page","file":"public/script.js","find":"async function load","state":"confirmed","line":3,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/script.js#L3"},{"layer":"api","does":"GET /api/notes","file":"server.js","find":"req.url === '/api/notes' && req.method === 'GET'","state":"confirmed","line":11,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L11"},{"layer":"data","does":"Reads notes.json from the working directory","file":"server.js","find":"fs.readFileSync('notes.json')","state":"confirmed","line":13,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L13"}],"depends_on":[],"tests":[],"untested":["Everything: the project has no tests"],"decisions":[],"debt":[{"id":"xss","kind":"bug","status":"open","files":["public/script.js"],"text":"Note text is inserted with innerHTML without escaping, so a note containing HTML runs in the page (inferred by the assistant from public/script.js:5; not demonstrated)."}],"findings":[{"level":"warn","code":"NO_TESTS","message":"built, but no test is linked","feature":"see-notes"},{"level":"info","code":"NEVER_CHECKED","message":"never confirmed against the code; run `proofcard map mark see-notes` after reviewing it","feature":"see-notes"}]},{"id":"add-note","name":"Add a note (with English translation)","status":"built","user_action":"Types a note and presses Add; the note appears with an English translation.","flow":[{"layer":"screen","does":"Text box and Add button","file":"public/index.html","find":"onclick=\"addNote()\"","state":"confirmed","line":3,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/index.html#L3"},{"layer":"frontend","does":"Sends the note","file":"public/script.js","find":"async function addNote","state":"confirmed","line":8,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/script.js#L8"},{"layer":"api","does":"POST /api/notes","file":"server.js","find":"req.url === '/api/notes' && req.method === 'POST'","state":"confirmed","line":15,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L15"},{"layer":"external","does":"Asks a translation service for English (needs TRANSLATE_KEY)","file":"server.js","find":"https://api.example-translate.com/v1/translate","state":"confirmed","line":23,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L23"},{"layer":"data","does":"Rewrites the whole notes.json","file":"server.js","find":"fs.writeFileSync('notes.json'","state":"confirmed","line":26,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/server.js#L26"}],"depends_on":["see-notes"],"tests":[],"untested":["Everything: the project has no tests","What the user sees when the translation service fails: unknown (no error handling in server.js)"],"decisions":[],"debt":[{"id":"translate-hack","kind":"workaround","status":"open","files":["server.js"],"text":"Marked 'temporary hack' in server.js:22. The API key and the note text are put in the URL; the text is not URL-encoded; any failure there leaves the request without a response (inferred by the assistant from server.js:23-25)."},{"id":"rewrite-all","kind":"debt","status":"open","files":["server.js"],"text":"Each new note re-reads and rewrites the whole file; simultaneous adds can lose notes."}],"findings":[{"level":"warn","code":"NO_TESTS","message":"built, but no test is linked","feature":"add-note"},{"level":"info","code":"NEVER_CHECKED","message":"never confirmed against the code; run `proofcard map mark add-note` after reviewing it","feature":"add-note"}]},{"id":"delete-note","name":"Delete a note","status":"building","user_action":"Presses x next to a note to delete it.","flow":[{"layer":"screen","does":"x button next to each note","file":"public/script.js","find":"onclick=\"del(","state":"confirmed","line":5,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/script.js#L5"},{"layer":"frontend","does":"Sends the delete request","file":"public/script.js","find":"async function del","state":"confirmed","line":13,"href":"https://github.com/Moosartist/proofcard/blob/76b6d9f12da73d977f542bf67ef2f1ec8792c6bb/examples/messy-notes/public/script.js#L13"},{"layer":"api","does":"POST /api/notes/delete — no handler exists in this repo","file":"unknown","state":"unknown","line":null,"href":null}],"depends_on":["see-notes"],"tests":[],"untested":["Everything"],"decisions":[],"debt":[{"id":"delete-missing","kind":"bug","status":"open","files":["public/script.js"],"text":"The button calls POST /api/notes/delete but the server has no such route (scan: unhandled-call at public/script.js:14); the server answers 'not found' and the note stays."}],"findings":[{"level":"warn","code":"UNKNOWN_LINK","message":"step 3 (api) is marked unknown: \"POST /api/notes/delete — no handler exists in this repo\"","feature":"delete-note"},{"level":"info","code":"NEVER_CHECKED","message":"never confirmed against the code; run `proofcard map mark delete-note` after reviewing it","feature":"delete-note"}]}],"project_findings":[{"level":"warn","code":"UNMAPPED_FILE","message":"old-utils.js (module) is not part of any feature","file":"old-utils.js"},{"level":"warn","code":"UNMAPPED_ROUTE","message":"/ (server.js:6) is not cited by any feature","file":"server.js"},{"level":"info","code":"MESS_ORPHAN","message":"old-utils.js: not imported or loaded by any file","file":"old-utils.js"},{"level":"info","code":"MESS_MIXED_RESPONSIBILITY","message":"server.js: one file handles backend + data + external","file":"server.js"},{"level":"info","code":"MESS_UNHANDLED_CALL","message":"public/script.js:14: POST /api/notes/delete has no matching route in this repo","file":"public/script.js"}],"files":7};
const $=(s)=>document.querySelector(s);
const e=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LN={screen:'Screen',frontend:'In the browser',api:'API',service:'Server logic',data:'Data',external:'Outside services'};
const SYM={confirmed:'✓',unverified:'·',planned:'○',stale:'✗',broken:'✗',unknown:'?'};
function chip(l){const t=(l.file&&l.file!=='unknown'?l.file:'unknown')+(l.line?':'+l.line:'');const inner=SYM[l.state]+' '+e(t);return l.href?'<a class="chip '+l.state+'" href="'+e(l.href)+'" target="_blank" rel="noopener">'+inner+'</a>':'<span class="chip '+l.state+'" title="'+e(l.state)+'">'+inner+'</span>'}
function header(){$('#title').textContent=(D.project.name||'Project')+' — project map';$('#summary').textContent=(D.project.summary||'')+(D.commit?'  ·  commit '+D.commit:'')+'  ·  generated '+D.generated;
const by=s=>D.features.filter(f=>f.status===s).length;
$('#counts').innerHTML='<span class="pill ok">'+by('built')+' built</span><span class="pill">'+by('building')+' in progress</span><span class="pill">'+by('planned')+' planned</span><span class="pill error">'+D.counts.error+' broken links</span><span class="pill warn">'+D.counts.warn+' gaps</span>'}
function list(){const q=$('#q').value.toLowerCase();$('#list').innerHTML='<button data-id="" class="'+(cur?'':'on')+'"><span>System overview</span></button>'+D.features.filter(f=>!q||JSON.stringify(f).toLowerCase().includes(q)).map(f=>'<button data-id="'+e(f.id)+'" class="'+(cur===f.id?'on':'')+'"><span>'+e(f.name)+'</span><span class="st '+e(f.status)+'">'+e(f.status)+'</span></button>').join('');
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{location.hash=b.dataset.id?'f='+b.dataset.id:''})}
function overview(){const cols=D.layers;let h='<section class="card"><h2>System overview</h2><div class="sub">Each row is something the user can do. Each column is a part of the system. Click a feature to follow it.</div><h3>Features × parts of the system</h3><table class="grid"><tr><th>Feature</th>'+cols.map(c=>'<th>'+LN[c]+'</th>').join('')+'<th>Tests</th></tr>';
for(const f of D.features){h+='<tr><td class="fname" data-id="'+e(f.id)+'">'+e(f.name)+'<br><span class="st '+e(f.status)+'">'+e(f.status)+'</span></td>'+cols.map(c=>'<td>'+f.flow.filter(s=>s.layer===c).map(chip).join('')+'</td>').join('')+'<td>'+(f.tests.length?'<span class="chip '+(f.tests.every(t=>t.state==='confirmed')?'confirmed':'stale')+'">'+f.tests.filter(t=>t.state==='confirmed').length+'/'+f.tests.length+' found</span>':'<span class="empty">none</span>')+'</td></tr>'}
h+='</table></section>';
if(D.structure)h+='<section class="card"><h2>How the project is organised</h2><div class="sub">Agreed responsibility of each part. Changes should respect these boundaries.</div><ul>'+Object.entries(D.structure).map(([k,v])=>'<li><code>'+e(k)+'</code> — '+e(v)+'</li>').join('')+'</ul></section>';
if(D.proposals.length)h+='<section class="card"><h2>Proposed reorganisation</h2><div class="sub">Suggestions with their reason. Nothing is moved until someone decides to.</div><ul>'+D.proposals.map(p=>'<li><span class="st '+(p.status==='done'?'built':'planned')+'">'+e(p.status||'proposed')+'</span> <b>'+e(p.change)+'</b> — '+e(p.why)+(p.serves&&p.serves.length?' <span class="src">(helps: '+p.serves.map(e).join(', ')+')</span>':'')+'</li>').join('')+'</ul></section>';
const pf=D.project_findings.filter(x=>x.level!=='info'),mess=D.project_findings.filter(x=>x.level==='info');
h+='<section class="card"><h2>Gaps between the map and the code</h2><div class="sub">Found by scanning '+D.files+' files. These are parts of the code no feature explains yet.</div>'+(pf.length?pf.map(x=>'<div class="f '+x.level+'">'+e(x.message)+'</div>').join(''):'<p class="empty">None found.</p>')+'</section>';
h+='<section class="card"><h2>Signs of mess worth a look</h2><div class="sub">Mechanical hints (mixed responsibilities, orphan files, calls with no handler…). Not verdicts.</div>'+(mess.length?mess.map(x=>'<div class="f info">'+e(x.message)+'</div>').join(''):'<p class="empty">None found.</p>')+'</section>';
$('#content').innerHTML=h;document.querySelectorAll('td.fname').forEach(td=>td.onclick=()=>{location.hash='f='+td.dataset.id})}
function feature(f){let h='<section class="card"><h2>'+e(f.name)+' <span class="st '+e(f.status)+'">'+e(f.status)+'</span></h2><div class="sub">'+(f.checked?'Map confirmed against the code at '+e(f.checked.commit.slice(0,7))+' on '+e(f.checked.date):'This entry has never been confirmed against the code.')+'</div>';
h+='<h3>What the user does</h3><p>'+(f.user_action?e(f.user_action):'<span class="empty">unknown</span>')+'</p>';
h+='<h3>What happens, from the screen to the data</h3><div class="flow">'+(f.flow.length?f.flow.map(s=>'<div class="step '+s.state+'" style="--c:var(--'+e(s.layer)+')"><div class="lay">'+e(LN[s.layer]||s.layer)+'</div><div class="does">'+e(s.does||'')+'</div>'+chip(s)+(s.source==='assistant'?'<div class="src">inferred by the assistant — needs review</div>':'')+(s.state==='stale'?'<div class="src">cited text "'+e(s.find)+'" is gone</div>':'')+'</div>').join(''):'<p class="empty">No steps mapped yet.</p>')+'</div>';
if(f.depends_on&&f.depends_on.length)h+='<h3>Relies on</h3><p>'+f.depends_on.map(d=>'<a href="#f='+e(d)+'">'+e((D.features.find(x=>x.id===d)||{}).name||d)+'</a>').join(', ')+'</p>';
h+='<h3>Tested by</h3>'+(f.tests.length?'<ul>'+f.tests.map(t=>'<li>'+chip(t)+' '+e(t.find||'')+'</li>').join('')+'</ul>':'<p class="empty">No linked tests.</p>');
h+='<h3>Not tested</h3>'+(f.untested&&f.untested.length?'<ul>'+f.untested.map(u=>'<li>'+e(u)+'</li>').join('')+'</ul>':'<p class="empty">Nothing listed.</p>');
h+='<h3>Why it is built this way</h3>'+(f.decisions&&f.decisions.length?'<ul>'+f.decisions.map(d=>'<li><b>'+e(d.decision)+'</b> — '+e(d.why)+'</li>').join('')+'</ul>':'<p class="empty">No decisions recorded.</p>');
h+='<h3>Known problems and technical debt</h3>'+(f.debt&&f.debt.length?'<ul>'+f.debt.map(d=>'<li><span class="st '+(d.status==='fixed'?'built':'building')+'">'+e(d.status||'open')+'</span> <b>'+e(d.kind||'debt')+'</b>: '+e(d.text)+(d.files?' <span class="src">('+d.files.map(e).join(', ')+')</span>':'')+(d.fixed_in?' <span class="src">fixed in '+e(d.fixed_in)+'</span>':'')+'</li>').join('')+'</ul>':'<p class="empty">None recorded.</p>');
const fs=f.findings;h+='<h3>Map vs code</h3>'+(fs.length?fs.map(x=>'<div class="f '+x.level+'">'+e(x.code)+': '+e(x.message)+'</div>').join(''):'<p class="empty">No problems found.</p>');
$('#content').innerHTML=h+'</section>'}
let cur='';function route(){const m=/f=([^&]+)/.exec(location.hash);cur=m?decodeURIComponent(m[1]):'';const f=D.features.find(x=>x.id===cur);if(!f)cur='';list();f?feature(f):overview();scrollTo(0,0)}
$('#q').oninput=list;addEventListener('hashchange',route);header();route();
</script>
</body>
</html>
